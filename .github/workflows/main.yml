name: Deploy

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - run: cp .env.sample .env && npm ci && npm run test && npm run build
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          NEXT_PUBLIC_GALLERY_DRIVE_FOLDER_ID: ${{ vars.GALLERY_DRIVE_FOLDER_ID }}
      - uses: w9jds/firebase-action@fc894b2de04cfc04c398e98dea8ac546470fbd6b # v15.34.0
        with:
          args: deploy
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
